apiVersion: v1
kind: Namespace
metadata:
  name: netpol-two-sided
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: netpol-two-sided
  labels:
    app: client
spec:
  containers:
    - name: client
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: netpol-two-sided
  labels:
    app: api
spec:
  containers:
    - name: api
      image: registry.k8s.io/pause:3.10
      ports:
        - name: https
          containerPort: 443
---
apiVersion: v1
kind: Pod
metadata:
  name: blocked-api
  namespace: netpol-two-sided
  labels:
    app: blocked-api
spec:
  containers:
    - name: api
      image: registry.k8s.io/pause:3.10
      ports:
        - name: https
          containerPort: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-egress
  namespace: netpol-two-sided
spec:
  podSelector:
    matchLabels:
      app: client
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: blocked-api
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: netpol-two-sided
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: client
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blocked-api-default-deny
  namespace: netpol-two-sided
spec:
  podSelector:
    matchLabels:
      app: blocked-api
  policyTypes:
    - Ingress
  ingress: []
