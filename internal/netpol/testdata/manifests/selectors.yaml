apiVersion: v1
kind: Namespace
metadata:
  name: netpol-selectors-a
  labels:
    team: a
---
apiVersion: v1
kind: Namespace
metadata:
  name: netpol-selectors-b
  labels:
    team: b
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: netpol-selectors-a
  labels:
    app: api
spec:
  containers:
    - name: api
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: local-client
  namespace: netpol-selectors-a
  labels:
    app: client
spec:
  containers:
    - name: client
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: remote-client
  namespace: netpol-selectors-b
  labels:
    app: client
spec:
  containers:
    - name: client
      image: registry.k8s.io/pause:3.10
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: selector-semantics
  namespace: netpol-selectors-a
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: client
    - from:
        - {}
