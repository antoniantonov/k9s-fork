apiVersion: v1
kind: Namespace
metadata:
  name: netpol-named-ports
---
apiVersion: batch/v1
kind: Job
metadata:
  name: caller
  namespace: netpol-named-ports
spec:
  template:
    metadata:
      labels:
        app: caller
    spec:
      restartPolicy: Never
      containers:
        - name: caller
          image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: caller
  namespace: netpol-named-ports
  labels:
    app: caller
spec:
  containers:
    - name: caller
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: netpol-named-ports
  labels:
    app: api
spec:
  containers:
    - name: api
      image: registry.k8s.io/pause:3.10
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-named-http
  namespace: netpol-named-ports
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: caller
      ports:
        - protocol: TCP
          port: http
